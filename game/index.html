<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHADOW SHIFT — top-down stealth</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="SHADOW SHIFT: a top-down stealth game. Move with WASD or the arrow keys, hold Shift to sneak, stay out of the guards' vision cones, take the objective and reach the exit."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
